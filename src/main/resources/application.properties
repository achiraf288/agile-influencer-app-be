spring.application.name=influencer-platform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/influencer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deployment-1234567890}
jwt.expiration=86400000

server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
