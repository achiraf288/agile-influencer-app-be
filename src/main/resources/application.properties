spring.application.name=influencer-platform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:influencer_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
h2.console.enabled=true
h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deployment-1234567890}
jwt.expiration=86400000

server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
